[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-pilot"
version = "0.2.0"
description = "Multi-asset cryptocurrency reinforcement-learning trading research toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ccxt>=4.0",
  "gymnasium>=0.29",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "sb3-contrib>=2.2",
  "stable-baselines3>=2.2",
  "ta>=0.11",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

