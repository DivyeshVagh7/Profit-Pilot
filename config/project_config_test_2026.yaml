project:
  name: Profit-Pilot
  exchange: binance

data:
  raw_dir: data/raw_test_2026
  processed_dir: data/processed_test_2026
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 1h
  since: "2026-01-01T00:00:00Z"
  until: "2026-04-13T00:00:00Z"
  download_limit: 1000

environment:
  lookback: 50
  initial_cash: 10000.0
  buy_cost_pct: 0.001
  sell_cost_pct: 0.001
  cash_norm: 0.0001
  holdings_norm: 1.0
  tech_norm: 1.0
  reward_scaling: 1.0
  reward_mode: return_cost_risk
  cost_penalty_weight: 1.0
  risk_penalty_weight: 0.005
  min_trade_quantity: 0.0001
  cooldown_steps: 0

training:
  total_timesteps: 20000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  device: auto
  use_lstm: false
  model_dir: models/train_2022_2025
  report_dir: reports/test_2026
