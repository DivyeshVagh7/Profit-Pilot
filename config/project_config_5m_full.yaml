project:
  name: Profit-Pilot
  exchange: binanceus

data:
  raw_dir: data/raw_colab_5m_2024_2026
  processed_dir: data/processed_colab_5m_full_2024_2026
  symbols:
    - BTC/USDT
    - ETH/USDT
  timeframe: 5m
  since: "2024-01-01T00:00:00Z"
  until: "2026-04-28T23:55:00Z"
  download_limit: 1000

environment:
  lookback: 96
  initial_cash: 10000.0
  buy_cost_pct: 0.001
  sell_cost_pct: 0.001
  cash_norm: 0.0001
  holdings_norm: 1.0
  tech_norm: 1.0
  reward_scaling: 1.0
  reward_mode: net_log_return_alpha
  action_mode: cash_target_allocation
  cost_penalty_weight: 0.10
  risk_penalty_weight: 0.10
  alpha_reward_weight: 1.0
  drawdown_penalty_weight: 0.20
  risk_halt_penalty_weight: 0.05
  volatility_reward_weight: 0.0
  volatility_window: 288
  risk_adjusted_return_clip: 5.0
  max_position_fraction: 0.60
  max_gross_exposure: 0.80
  max_trade_fraction: 0.50
  stop_loss_pct: 0.07
  max_drawdown_pct: 0.25
  min_trade_quantity: 0.0001
  cooldown_steps: 6
  random_start: true
  episode_length: 2880
  trade_deadband: 0.10
  rebalance_threshold: 0.08
  min_trade_notional: 50.0
  turnover_penalty_weight: 0.02

training:
  total_timesteps: 1500000
  learning_rate: 0.00003
  n_steps: 4096
  batch_size: 1024
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.08
  ent_coef: 0.001
  device: auto
  use_lstm: false
  model_dir: models/local_5m_cash_allocation
  report_dir: reports/local_5m_cash_allocation/full_window
  target_kl: 0.02
